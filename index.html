<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUMI Blog · 张轶尘</title>
<meta name="description" content="GUMI Blog —— 记录与分享的个人博客。薄荷绿、零依赖、有同款 Android App。">
<style>
  :root{
    --green:#10b981;
    --green-dark:#0d9488;
    --green-deep:#065f46;
    --mint:#ecfdf5;
    --mint-2:#d1fae5;
    --ink:#1f2937;
    --ink-soft:#4b5563;
    --card:#ffffff;
    --bg:#f6faf8;
    --border:#e2e8f0;
    --shadow:0 2px 12px rgba(16,185,129,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.85;
  }
  a{color:var(--green-dark);text-decoration:none}

  header{background:linear-gradient(315deg,var(--mint) 0%,var(--mint-2) 45%,#a7f3d0 100%);border-bottom:1px solid var(--border)}
  .nav{
    max-width:860px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:var(--green-deep)}
  .logo:hover .logo-text{color:var(--green-dark)}
  .nav-links a{padding:6px 14px;border-radius:999px;font-size:.95rem;color:var(--ink-soft)}
  .nav-links a:hover{background:rgba(255,255,255,.7);color:var(--green-dark)}

  .hero{
    max-width:860px;margin:0 auto;padding:64px 20px 44px;text-align:center;
  }
  .hero .logo-big{
    display:inline-block;animation:floaty 3.2s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero h1{font-size:2.2rem;letter-spacing:.5px;color:var(--green-deep);margin-top:14px}
  .hero .sub{color:var(--ink-soft);max-width:520px;margin:10px auto 0}

  .wrap{max-width:860px;margin:0 auto;padding:0 20px 48px}

  .section-title{
    display:flex;align-items:center;gap:10px;
    font-size:1.25rem;color:var(--ink);margin:26px 0 16px;
  }
  .section-title::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--green)}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(16,185,129,.18)}
  .card h3{font-size:1.02rem;color:var(--green-deep);margin-bottom:6px}
  .card p{font-size:.88rem;color:var(--ink-soft)}
  .card .icon{font-size:1.5rem;display:block;margin-bottom:8px}

  .cta{
    margin:30px 0 10px;text-align:center;
    background:linear-gradient(120deg,var(--mint) 0%,var(--mint-2) 100%);
    border:1px solid var(--border);border-radius:16px;padding:34px 24px;
  }
  .cta h3{color:var(--green-deep);font-size:1.3rem;margin-bottom:6px}
  .cta p{color:var(--ink-soft);font-size:.92rem;max-width:480px;margin:0 auto 20px}
  .btn-go{
    display:inline-block;background:var(--green);color:#fff;
    padding:12px 44px;border-radius:999px;font-size:1.05rem;font-weight:600;
    box-shadow:0 4px 14px rgba(16,185,129,.35);
    transition:transform .2s,box-shadow .2s,background .2s;
  }
  .btn-go:hover{background:var(--green-dark);transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,185,129,.4)}

  footer{
    text-align:center;color:var(--ink-soft);font-size:.85rem;
    padding:26px 20px 34px;border-top:1px solid var(--border);
  }
  footer .heart{color:var(--green)}

  @media (max-width:560px){
    .hero h1{font-size:1.7rem}
  }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a class="logo" href="#" aria-label="GUMI Blog">
      <svg width="30" height="30" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#10b981"/>
        <path d="M13 24c0-4 3-7 7-7s7 3 7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="15.5" cy="16" r="1.8" fill="#fff"/>
        <circle cx="24.5" cy="16" r="1.8" fill="#fff"/>
      </svg>
      <span class="logo-text">GUMI Blog</span>
    </a>
    <div class="nav-links">
      <a href="blog-main.html">文章列表</a>
      <a href="blog-about.html">关于</a>
    </div>
  </nav>
</header>

<section class="hero">
  <span class="logo-big">
    <svg width="88" height="88" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="#10b981"/>
      <path d="M13 24c0-4 3-7 7-7s7 3 7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="15.5" cy="16" r="1.8" fill="#fff"/>
      <circle cx="24.5" cy="16" r="1.8" fill="#fff"/>
    </svg>
  </span>
  <h1>GUMI Blog</h1>
  <p class="sub">Published By 张轶尘</p>
</section>

<div class="wrap">
  <h2 class="section-title">这里有什么</h2>
  <div class="card-grid">
    <div class="card">
      <span class="icon">✍️</span>
      <h3>VOCALOID爱好者</h3>
      <p>你想听的，都在这里。</p>
    </div>
    <div class="card">
      <span class="icon">🌿</span>
      <h3>薄荷绿阅读体验</h3>
      <p>统一的绿色系排版：清晰的层级、留足呼吸感的正文。</p>
    </div>
    <div class="card">
      <span class="icon">💡</span>
      <h3>迸发的灵感</h3>
      <p>与同爱好者交流。</p>
    </div>
    <div class="card">
      <span class="icon">⚡</span>
      <h3>轻量纯净</h3>
      <p>极速无广。</p>
    </div>
  </div>

  <div class="cta">
    <h3>现在就去看看</h3>
    <p>最新文章、往期记录，都在博客里。</p>
    <a class="btn-go" href="blog-main.html">进入博客 →</a>
  </div>
</div>

<footer>
  <p>GUMI Blog · 由 <span class="heart">♥</span>驱动 · ©️张轶尘 Copyright 2026</p>
</footer>

</body>
</html>
