<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XiMiMusic</title>
<meta name="description" content="XiMiMusic —— zyc">
<style>
  :root{
    --green:#10b981;
    --green-dark:#0d9488;
    --green-deep:#065f46;
    --mint:#ecfdf5;
    --mint-2:#d1fae5;
    --ink:#1f2937;
    --ink-soft:#4b5563;
    --card:#ffffff;
    --border:#e2e8f0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
    background:linear-gradient(160deg,#ecfdf5 0%,#d1fae5 45%,#a7f3d0 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;
    color:var(--ink);
  }
  a{text-decoration:none}

  /* ---- 淡化背景：https://sfile.chatglm.cn/workspace/image/ad/ad3cd662c8.jpg 随滚动视差 ---- */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:url("https://sfile.chatglm.cn/workspace/image/ad/ad3cd662c8.jpg") center 30% / cover no-repeat fixed;
    opacity:.13;
    pointer-events:none;
  }
  @media (max-width:768px){
    /* 移动端不支持 fixed 附件，改用固定层 */
    body::before{background-attachment:scroll;background-position:center 12%}
  }

  /* ---- 返回按钮 ---- */
  .back{
    position:fixed;top:22px;left:22px;z-index:10;
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 20px 9px 14px;border-radius:999px;
    background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    color:var(--green-deep);font-size:.95rem;font-weight:600;
    border:1px solid rgba(16,185,129,.25);
    box-shadow:0 2px 10px rgba(16,185,129,.15);
    transition:background .2s,transform .2s,box-shadow .2s;
  }
  .back:hover{
    background:#fff;transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(16,185,129,.25);
  }
  .back svg{flex:none}

  /* ---- 顶部 ---- */
  header{
    width:100%;max-width:900px;margin:0 auto;
    padding:76px 20px 0;text-align:center;
  }
  .disc{
    width:84px;height:84px;margin:0 auto 16px;border-radius:50%;
    background:radial-gradient(circle at center,#fff 0 14%,var(--green) 15% 30%,#065f46 31% 100%);
    box-shadow:0 8px 26px rgba(16,185,129,.4);
    animation:spin 7s linear infinite;
    display:flex;align-items:center;justify-content:center;
  }
  .disc span{
    width:13px;height:13px;border-radius:50%;
    background:#fff;box-shadow:inset 0 0 0 3px var(--green);
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:1.8rem;color:var(--green-deep);letter-spacing:1px}
  .sub{color:var(--ink-soft);font-size:.95rem;margin-top:6px}

  /* ---- 选项卡 ---- */
  .tabs{
    display:flex;justify-content:center;gap:10px;
    margin:30px auto 8px;
  }
  .tab{
    padding:9px 30px;border-radius:999px;border:none;cursor:pointer;
    font-size:1rem;font-weight:600;font-family:inherit;
    background:rgba(255,255,255,.65);color:var(--ink-soft);
    border:1px solid rgba(16,185,129,.2);
    transition:background .2s,color .2s,transform .2s,box-shadow .2s;
  }
  .tab:hover{background:#fff;transform:translateY(-1px)}
  .tab.active{
    background:var(--green);color:#fff;
    box-shadow:0 6px 18px rgba(16,185,129,.35);
  }

  /* ---- 搜索框 ---- */
  .search-wrap{display:flex;justify-content:center;margin:6px auto 0;padding:0 20px}
  .search-box{
    width:100%;max-width:460px;
    display:flex;align-items:center;gap:10px;
    padding:10px 18px;border-radius:999px;
    background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    border:1px solid rgba(16,185,129,.25);
    box-shadow:0 2px 12px rgba(16,185,129,.12);
    transition:box-shadow .2s,border-color .2s;
  }
  .search-box:focus-within{border-color:var(--green);box-shadow:0 4px 18px rgba(16,185,129,.25)}
  .search-box svg{flex:none;color:var(--green-dark)}
  .search-box input{
    flex:1;border:none;outline:none;background:transparent;
    font-size:.98rem;font-family:inherit;color:var(--ink);min-width:0;
  }
  .search-box input::placeholder{color:#94a3b8}
  .search-clear{
    border:none;background:var(--mint-2);color:var(--green-dark);
    width:24px;height:24px;border-radius:50%;cursor:pointer;flex:none;
    display:none;align-items:center;justify-content:center;font-size:14px;line-height:1;
  }
  .search-clear.show{display:flex}

  /* ---- 无结果提示 ---- */
  .no-result{
    display:none;text-align:center;padding:44px 20px;
    color:var(--ink-soft);font-size:.95rem;
  }
  .no-result.show{display:block;animation:fadein .3s ease}
  .no-result b{color:var(--green-deep)}

  /* ---- 卡片区 ---- */
  main{
    width:100%;max-width:900px;margin:0 auto;
    padding:26px 20px 46px;flex:1;
  }
  .tab-panel{display:none}
  .tab-panel.active{display:block;animation:fadein .35s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    box-shadow:0 4px 16px rgba(16,185,129,.08);
    padding:24px 26px;margin-bottom:20px;
  }
  .card h2{
    font-size:1.1rem;color:var(--green-deep);margin-bottom:6px;
    display:flex;align-items:center;gap:10px;
  }
  .card h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--green);flex:none}
  .card .desc{font-size:.9rem;color:var(--ink-soft);margin-bottom:16px}

  .player-wrap{
    border-radius:10px;overflow:hidden;
    box-shadow:0 6px 20px rgba(6,95,70,.15);
  }
  .player-wrap iframe{display:block;width:100%;height:175px;border:0}

  /* ---- 空白占位卡片 ---- */
  .empty{
    border:2px dashed #a7f3d0;border-radius:16px;
    background:rgba(255,255,255,.4);
    padding:30px 26px;margin-bottom:20px;
    display:flex;align-items:center;gap:18px;
    color:#94a3b8;transition:border-color .2s,background .2s;
  }
  .empty:hover{border-color:var(--green);background:rgba(255,255,255,.7)}
  .empty .plus{
    width:46px;height:46px;border-radius:50%;flex:none;
    background:var(--mint-2);color:var(--green-dark);
    display:flex;align-items:center;justify-content:center;
  }
  .empty .hint b{display:block;color:var(--green-deep);font-size:.98rem;margin-bottom:3px}
  .empty .hint span{font-size:.82rem}
  .empty[hidden]{display:none}

  /* ---- 页脚 ---- */
  footer{
    text-align:center;padding:34px 20px 36px;
    color:var(--green-deep);font-size:.88rem;
  }
  footer .foot-disc{
    width:34px;height:34px;margin:0 auto 12px;border-radius:50%;
    background:radial-gradient(circle at center,#fff 0 14%,var(--green) 15% 32%,var(--green-deep) 33% 100%);
    box-shadow:0 4px 14px rgba(16,185,129,.35);
    animation:spin 7s linear infinite;
  }
  footer .foot-line{
    width:120px;height:1px;margin:0 auto 14px;
    background:linear-gradient(90deg,transparent,rgba(6,95,70,.35),transparent);
  }
  footer p{opacity:.85}
  footer .foot-sub{font-size:.8rem;margin-top:4px;opacity:.6}

  @media (max-width:560px){
    header{padding-top:64px 16px 0}
    h1{font-size:1.45rem}
    .tab{padding:8px 22px;font-size:.92rem}
    .card,.empty{padding:20px 18px}
    .back{top:14px;left:14px;padding:8px 16px 8px 12px}
  }
</style>
</head>

<script>
(function(){
  var tabs = document.querySelectorAll('.tab');
  var panels = document.querySelectorAll('.tab-panel');

  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){
        t.classList.toggle('active', t === tab);
        t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
      });
      panels.forEach(function(p){
        p.classList.toggle('active', p.id === 'panel-' + tab.dataset.tab);
      });
    });
  });
})();

/* ---- 搜索 ---- */
(function(){
  var input = document.getElementById('song-search');
  var clearBtn = document.getElementById('search-clear');
  var panels = document.querySelectorAll('.tab-panel');

  function filter(){
    var q = input.value.trim().toLowerCase();
    clearBtn.classList.toggle('show', q.length > 0);
    panels.forEach(function(panel){
      var visible = 0;
      panel.querySelectorAll('.card').forEach(function(card){
        var text = (card.querySelector('h2') ? card.querySelector('h2').textContent : '') + ' ' +
                   (card.querySelector('.desc') ? card.querySelector('.desc').textContent : '');
        var hit = !q || text.toLowerCase().indexOf(q) !== -1;
        card.style.display = hit ? '' : 'none';
        if (hit) visible++;
      });
      panel.querySelectorAll('.empty').forEach(function(el){
        el.hidden = q.length > 0;   /* 搜索时隐藏占位卡 */
      });
      var nr = panel.querySelector('.no-result');
      if (nr){
        nr.querySelector('.nr-q').textContent = input.value.trim();
        nr.classList.toggle('show', q.length > 0 && visible === 0);
      }
    });
  }

  input.addEventListener('input', filter);
  clearBtn.addEventListener('click', function(){
    input.value = '';
    filter();
    input.focus();
  });
})();
</script>
