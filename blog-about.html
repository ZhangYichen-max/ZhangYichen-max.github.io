<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 · GUMI Blog</title>
<meta name="description" content="关于 GUMI Blog 和博主">
<style>
  :root{
    --green:#10b981;
    --green-dark:#0d9488;
    --green-deep:#065f46;
    --mint:#ecfdf5;
    --mint-2:#d1fae5;
    --ink:#1f2937;
    --ink-soft:#4b5563;
    --card:#ffffff;
    --bg:#f6faf8;
    --border:#e2e8f0;
    --shadow:0 2px 12px rgba(16,185,129,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.85;
  }
  a{color:var(--green-dark);text-decoration:none;transition:color .2s}
  a:hover{color:var(--green)}

  header{
    background:linear-gradient(135deg,#ecfdf5 0%,#d1fae5 55%,#a7f3d0 100%);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:10;
  }
  .nav{
    max-width:860px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:var(--green-deep)}
  .logo:hover .logo-text{color:var(--green-dark)}
  .nav-links{display:flex;gap:6px}
  .nav-links a{padding:6px 14px;border-radius:999px;font-size:.95rem;color:var(--ink-soft)}
  .nav-links a:hover{background:rgba(255,255,255,.7);color:var(--green-dark)}
  .nav-links a.active{background:var(--green);color:#fff}
  .nav-links a.dl-app{background:var(--green);color:#fff;font-weight:600}
  .nav-links a.dl-app:hover{background:var(--green-dark);color:#fff;transform:translateY(-1px)}


  main{max-width:720px;margin:0 auto;padding:44px 20px 60px}

  .about-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:38px 40px;box-shadow:var(--shadow);text-align:center;
  }
  .about-card .avatar{
    width:96px;height:96px;margin:0 auto 18px;border-radius:50%;
    background:linear-gradient(135deg,var(--green),#34d399);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 24px rgba(16,185,129,.35);
  }
  .about-card h1{font-size:1.6rem;color:var(--green-deep);margin-bottom:4px}
  .about-card .sub{color:#6b7280;font-size:.9rem;margin-bottom:20px}
  .about-card .desc{text-align:left;color:var(--ink-soft)}

  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
  .fact{
    background:var(--mint);border-radius:12px;padding:16px 12px;text-align:center;
  }
  .fact .num{font-size:1.5rem;font-weight:700;color:var(--green-dark)}
  .fact .label{font-size:.8rem;color:var(--ink-soft)}

  .links{margin-top:26px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
  .links a{
    display:inline-block;padding:8px 18px;border-radius:999px;font-size:.9rem;
    background:var(--mint-2);color:var(--green-dark);
    transition:background .2s;
  }
  .links a:hover{background:var(--green);color:#fff}

  .back-home{
    display:inline-block;margin-top:30px;padding:8px 22px;border-radius:999px;
    background:var(--green);color:#fff;font-size:.95rem;
  }
  .back-home:hover{background:var(--green-dark);color:#fff}

  footer{
    border-top:1px solid var(--border);
    text-align:center;padding:26px 20px;color:#9ca3af;font-size:.85rem;
  }
  footer .heart{color:var(--green)}

  @media (max-width:560px){
    .about-card{padding:26px 22px}
    .facts{grid-template-columns:1fr;}
    .nav{padding:12px 16px}
  }
</style>
</head>
<body>

      <a href="index.html">回主站</a>
      <a href="blog-main.html">首页</a>

  </nav>

        <circle cx="15" cy="17" r="2.4" fill="#fff"/>
